<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐱 桌宠陪伴门户</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 顶部导航（抖音风格） -->
<div id="top-nav">
  <div class="nav-tab nav-tab-small" data-cat="live">直播</div>
  <div class="nav-tab" data-cat="follow" onclick="switchTab(this)">关注</div>
  <div class="nav-tab active" data-cat="recommend" onclick="switchTab(this)">推荐</div>
  <div class="nav-tab nav-tab-small" data-cat="friend">朋友</div>
  <div class="nav-tab nav-tab-small" data-cat="shop">商城</div>
</div>

<!-- 视频流主页 -->
<div id="video-feed">
  <div id="video-slider"></div>
</div>

<!-- 底部导航 -->
<div id="bottom-nav">
  <div class="bottom-nav-item active">
    <span class="nav-icon">🏠</span>
    <span class="nav-label">首页</span>
  </div>
  <div class="bottom-nav-item">
    <span class="nav-icon">👥</span>
    <span class="nav-label">朋友</span>
  </div>
  <div class="bottom-nav-add">
    <span>+</span>
  </div>
  <div class="bottom-nav-item">
    <span class="nav-icon">💬</span>
    <span class="nav-label">消息</span>
  </div>
  <div class="bottom-nav-item">
    <span class="nav-icon">👤</span>
    <span class="nav-label">我</span>
  </div>
</div>

<!-- 全屏分区页面 -->
<div id="category-page">
  <button class="category-close" onclick="closeCategoryPage()">✕</button>
  <div class="category-header">
    <div class="category-header-title">分区</div>
    <div class="category-header-sub">双击小猫可打开此页面</div>
  </div>
  <div class="category-section">
    <div class="category-section-title">推荐分区</div>
    <div class="category-grid">
      <div class="category-item" onclick="selectCategory('study')">
        <div class="category-icon icon-study">📚</div>
        <div class="category-label">学习区</div>
      </div>
      <div class="category-item" onclick="selectCategory('game')">
        <div class="category-icon icon-game">🎮</div>
        <div class="category-label">游戏区</div>
      </div>
      <div class="category-item" onclick="selectCategory('food')">
        <div class="category-icon icon-food">🍜</div>
        <div class="category-label">美食区</div>
      </div>
      <div class="category-item" onclick="selectCategory('fashion')">
        <div class="category-icon icon-fashion">👗</div>
        <div class="category-label">穿搭区</div>
      </div>
      <div class="category-item" onclick="selectCategory('music')">
        <div class="category-icon icon-music">🎵</div>
        <div class="category-label">音乐区</div>
      </div>
      <div class="category-item" onclick="selectCategory('dance')">
        <div class="category-icon icon-dance">💃</div>
        <div class="category-label">舞蹈区</div>
      </div>
      <div class="category-item" onclick="selectCategory('anime')">
        <div class="category-icon icon-anime">🎬</div>
        <div class="category-label">动画区</div>
      </div>
      <div class="category-item" onclick="selectCategory('tech')">
        <div class="category-icon icon-tech">💻</div>
        <div class="category-label">科技区</div>
      </div>
    </div>
  </div>
  <div class="category-section">
    <div class="category-section-title">更多分区</div>
    <div class="category-grid">
      <div class="category-item" onclick="selectCategory('fitness')">
        <div class="category-icon icon-fitness">💪</div>
        <div class="category-label">健身区</div>
      </div>
      <div class="category-item" onclick="selectCategory('travel')">
        <div class="category-icon icon-travel">✈️</div>
        <div class="category-label">旅行区</div>
      </div>
      <div class="category-item" onclick="selectCategory('knowledge')">
        <div class="category-icon icon-knowledge">💡</div>
        <div class="category-label">知识区</div>
      </div>
      <div class="category-item" onclick="selectCategory('vlog')">
        <div class="category-icon icon-vlog">📹</div>
        <div class="category-label">Vlog</div>
      </div>
      <div class="category-item" onclick="selectCategory('ai')">
        <div class="category-icon icon-ai">🤖</div>
        <div class="category-label">AI</div>
      </div>
      <div class="category-item" onclick="selectCategory('pet')">
        <div class="category-icon icon-pet">🐾</div>
        <div class="category-label">萌宠区</div>
      </div>
      <div class="category-item" onclick="selectCategory('film')">
        <div class="category-icon icon-film">🎥</div>
        <div class="category-label">影视区</div>
      </div>
      <div class="category-item" onclick="selectCategory('life')">
        <div class="category-icon icon-life">🌿</div>
        <div class="category-label">生活区</div>
      </div>
    </div>
  </div>
</div>

  <span class="sleep-zzz">z</span>
  <span class="sleep-zzz">Z</span>

    <!-- 像素风格小猫 - 灰白色虎斑猫 -->
    <g class="cat-body">
      <!-- 尾巴 - 像素风格 -->
      <g class="cat-tail">
        <rect x="26" y="22" width="2" height="2" fill="#A0A0A0"/>
        <rect x="28" y="20" width="2" height="2" fill="#A0A0A0"/>
        <rect x="28" y="22" width="2" height="2" fill="#B8B8B8"/>
        <rect x="30" y="18" width="2" height="2" fill="#A0A0A0"/>
        <rect x="30" y="20" width="2" height="2" fill="#C8C8C8"/>
      </g>
      
      <!-- 身体主体 -->
      <rect x="10" y="20" width="2" height="2" fill="#A0A0A0"/>
      <rect x="12" y="20" width="2" height="2" fill="#B8B8B8"/>
      <rect x="14" y="20" width="2" height="2" fill="#B8B8B8"/>

      <rect x="8" y="22" width="2" height="2" fill="#B8B8B8"/>

      <rect x="12" y="22" width="2" height="2" fill="#D0D0D0"/>
      <rect x="14" y="22" width="2" height="2" fill="#E8E8E8"/>
      <rect x="16" y="22" width="2" height="2" fill="#E8E8E8"/>
      <rect x="18" y="22" width="2" height="2" fill="#D0D0D0"/>
      <rect x="20" y="22" width="2" height="2" fill="#E8E8E8"/>
      <rect x="22" y="22" width="2" height="2" fill="#D0D0D0"/>
      <rect x="24" y="22" width="2" height="2" fill="#B8B8B8"/>

      <rect x="10" y="24" width="2" height="1" fill="#A0A0A0"/>

    <!-- 左耳 -->
    <rect x="6" y="4" width="2" height="2" fill="#A0A0A0"/>

    <rect x="6" y="6" width="2" height="2" fill="#B8B8B8"/>
    <rect x="4" y="2" width="2" height="2" fill="#A0A0A0"/>
    <rect x="6" y="2" width="2" height="2" fill="#B8B8B8"/>

    <rect x="6" y="6" width="1" height="1" fill="#FFB0C0"/>

    <rect x="25" y="6" width="1" height="1" fill="#FFB0C0"/>
    <rect x="24" y="7" width="1" height="1" fill="#FFB0C0"/>
    
    <!-- 脸部两侧 -->

    <rect x="20" y="8" width="2" height="2" fill="#D8D8D8"/>
    <rect x="22" y="8" width="2" height="2" fill="#C8C8C8"/>
    
    <rect x="8" y="10" width="2" height="2" fill="#D0D0D0"/>
    <rect x="10" y="10" width="2" height="2" fill="#E8E8E8"/>
    <rect x="12" y="10" width="2" height="2" fill="#F0F0F0"/>
    <rect x="14" y="10" width="2" height="2" fill="#F5F5F5"/>
    <rect x="16" y="10" width="2" height="2" fill="#F5F5F5"/>
    <rect x="18" y="10" width="2" height="2" fill="#F0F0F0"/>
    <rect x="20" y="10" width="2" height="2" fill="#E8E8E8"/>

    <rect x="22" y="18" width="2" height="2" fill="#C8C8C8"/>

      <rect x="10" y="10" width="2" height="2" fill="#2A2A2A"/>
      <rect x="12" y="12" width="1" height="1" fill="#FFFFFF"/>
      <rect x="11" y="11" width="1" height="1" fill="#FFFFFF" opacity="0.7"/>

<!-- AI对话面板 -->
<div id="ai-chat-panel">
  <div class="ai-chat-header">
    <div class="ai-chat-title">🐱 小猫助手</div>
    <button class="ai-chat-close" onclick="closeAiChat()">✕</button>
  </div>
  <div class="ai-chat-messages" id="ai-messages"></div>
  <div class="ai-chat-input-bar">
    <input class="ai-chat-input" id="ai-input" type="text" placeholder="和小猫聊聊天..." maxlength="200" onkeydown="if(event.key==='Enter')sendAiMessage()">
    <button class="ai-chat-send" id="ai-send-btn" onclick="sendAiMessage()">↑</button>
  </div>
</div>

<!-- 圆形菜单 -->
<div id="circle-menu">
  <div class="menu-item" data-category="study" onclick="selectCategory('study')">
    <span class="menu-icon">📚</span>
    <span>学习区</span>
  </div>
  <div class="menu-item" data-category="game" onclick="selectCategory('game')">
    <span class="menu-icon">🎮</span>
    <span>游戏区</span>
  </div>
  <div class="menu-item" data-category="food" onclick="selectCategory('food')">
    <span class="menu-icon">🍜</span>
    <span>美食区</span>
  </div>
  <div class="menu-item" data-category="fashion" onclick="selectCategory('fashion')">
    <span class="menu-icon">👗</span>
    <span>穿搭区</span>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
