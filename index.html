<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐱 桌宠陪伴门户</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 顶部导航（抖音风格） -->
<div id="top-nav">
  <div class="nav-tab nav-tab-small" data-cat="live">直播</div>
  <div class="nav-tab" data-cat="follow" onclick="switchTab(this)">关注</div>
  <div class="nav-tab active" data-cat="recommend" onclick="switchTab(this)">推荐</div>
  <div class="nav-tab nav-tab-small" data-cat="friend">朋友</div>
  <div class="nav-tab nav-tab-small" data-cat="shop">商城</div>
</div>

<!-- 视频流主页 -->
<div id="video-feed">
  <div id="video-slider"></div>
</div>

<!-- 底部导航 -->
<div id="bottom-nav">
  <div class="bottom-nav-item active">
    <span class="nav-icon">🏠</span>
    <span class="nav-label">首页</span>
  </div>
  <div class="bottom-nav-item">
    <span class="nav-icon">👥</span>
    <span class="nav-label">朋友</span>
  </div>
  <div class="bottom-nav-add">
    <span>+</span>
  </div>
  <div class="bottom-nav-item">
    <span class="nav-icon">💬</span>
    <span class="nav-label">消息</span>
  </div>
  <div class="bottom-nav-item">
    <span class="nav-icon">👤</span>
    <span class="nav-label">我</span>
  </div>
</div>

<!-- 全屏分区页面 -->
<div id="category-page">
  <button class="category-close" onclick="closeCategoryPage()">✕</button>
  <div class="category-header">
    <div class="category-header-title">分区</div>
    <div class="category-header-sub">双击小猫可打开此页面</div>
  </div>
  <div class="category-section">
    <div class="category-section-title">推荐分区</div>
    <div class="category-grid">
      <div class="category-item" onclick="selectCategory('study')">
        <div class="category-icon icon-study">📚</div>
        <div class="category-label">学习区</div>
      </div>
      <div class="category-item" onclick="selectCategory('game')">
        <div class="category-icon icon-game">🎮</div>
        <div class="category-label">游戏区</div>
      </div>
      <div class="category-item" onclick="selectCategory('food')">
        <div class="category-icon icon-food">🍜</div>
        <div class="category-label">美食区</div>
      </div>
      <div class="category-item" onclick="selectCategory('fashion')">
        <div class="category-icon icon-fashion">👗</div>
        <div class="category-label">穿搭区</div>
      </div>
      <div class="category-item" onclick="selectCategory('music')">
        <div class="category-icon icon-music">🎵</div>
        <div class="category-label">音乐区</div>
      </div>
      <div class="category-item" onclick="selectCategory('dance')">
        <div class="category-icon icon-dance">💃</div>
        <div class="category-label">舞蹈区</div>
      </div>
      <div class="category-item" onclick="selectCategory('anime')">
        <div class="category-icon icon-anime">🎬</div>
        <div class="category-label">动画区</div>
      </div>
      <div class="category-item" onclick="selectCategory('tech')">
        <div class="category-icon icon-tech">💻</div>
        <div class="category-label">科技区</div>
      </div>
    </div>
  </div>
  <div class="category-section">
    <div class="category-section-title">更多分区</div>
    <div class="category-grid">
      <div class="category-item" onclick="selectCategory('fitness')">
        <div class="category-icon icon-fitness">💪</div>
        <div class="category-label">健身区</div>
      </div>
      <div class="category-item" onclick="selectCategory('travel')">
        <div class="category-icon icon-travel">✈️</div>
        <div class="category-label">旅行区</div>
      </div>
      <div class="category-item" onclick="selectCategory('knowledge')">
        <div class="category-icon icon-knowledge">💡</div>
        <div class="category-label">知识区</div>
      </div>
      <div class="category-item" onclick="selectCategory('vlog')">
        <div class="category-icon icon-vlog">📹</div>
        <div class="category-label">Vlog</div>
      </div>
      <div class="category-item" onclick="selectCategory('ai')">
        <div class="category-icon icon-ai">🤖</div>
        <div class="category-label">AI</div>
      </div>
      <div class="category-item" onclick="selectCategory('pet')">
        <div class="category-icon icon-pet">🐾</div>
        <div class="category-label">萌宠区</div>
      </div>
      <div class="category-item" onclick="selectCategory('film')">
        <div class="category-icon icon-film">🎥</div>
        <div class="category-label">影视区</div>
      </div>
      <div class="category-item" onclick="selectCategory('life')">
        <div class="category-icon icon-life">🌿</div>
        <div class="category-label">生活区</div>
      </div>
    </div>
  </div>
</div>

<!-- 悬浮窗桌宠 -->
<div id="pet-fab">
  <div id="speech-bubble"></div>
  <span class="sleep-zzz">Z</span>
  <span class="sleep-zzz">z</span>
  <span class="sleep-zzz">Z</span>
  <svg id="cat-svg" width="64" height="64" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- 尾巴 -->
    <path class="cat-tail" d="M 78 78 Q 92 62 88 46" stroke="#B0B0B0" stroke-width="5" fill="none" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="0 78 78;8 78 78;0 78 78;-5 78 78;0 78 78" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- 身体 -->
    <g class="cat-body">
      <!-- 身体主体 - 灰白色 -->
      <rect x="32" y="62" width="36" height="22" rx="4" fill="#D8D8D8"/>
      <!-- 肚子 - 更浅 -->
      <rect x="38" y="66" width="24" height="14" rx="3" fill="#E8E8E8"/>
      <!-- 虎斑纹路 - 身体 -->
      <rect x="36" y="64" width="4" height="2" rx="1" fill="#999"/>
      <rect x="44" y="63" width="4" height="2" rx="1" fill="#999"/>
      <rect x="52" y="64" width="4" height="2" rx="1" fill="#999"/>
      <rect x="60" y="63" width="4" height="2" rx="1" fill="#999"/>
      <rect x="40" y="68" width="3" height="2" rx="1" fill="#888" opacity="0.6"/>
      <rect x="48" y="67" width="3" height="2" rx="1" fill="#888" opacity="0.6"/>
      <rect x="56" y="68" width="3" height="2" rx="1" fill="#888" opacity="0.6"/>
      <!-- 前爪 -->
      <rect x="34" y="80" width="10" height="6" rx="3" fill="#C0C0C0"/>
      <rect x="36" y="82" width="6" height="3" rx="1.5" fill="#E0E0E0"/>
      <rect x="56" y="80" width="10" height="6" rx="3" fill="#C0C0C0"/>
      <rect x="58" y="82" width="6" height="3" rx="1.5" fill="#E0E0E0"/>
    </g>
    <!-- 头部 -->
    <rect x="28" y="30" width="44" height="36" rx="6" fill="#D8D8D8"/>
    <!-- 头顶虎斑纹 -->
    <rect x="38" y="32" width="6" height="3" rx="1" fill="#999"/>
    <rect x="50" y="31" width="6" height="3" rx="1" fill="#999"/>
    <rect x="44" y="35" width="4" height="2" rx="1" fill="#888" opacity="0.7"/>
    <!-- 额头M纹 -->
    <rect x="40" y="34" width="3" height="2" fill="#999"/>
    <rect x="48" y="33" width="3" height="2" fill="#999"/>
    <rect x="56" y="34" width="3" height="2" fill="#999"/>
    <!-- 左耳 -->
    <polygon class="cat-ear-left" points="30,32 24,12 40,28" fill="#C0C0C0"/>
    <polygon class="cat-ear-left" points="31,30 27,16 38,28" fill="#FFB0C0"/>
    <!-- 右耳 -->
    <polygon class="cat-ear-right" points="70,32 76,12 60,28" fill="#C0C0C0"/>
    <polygon class="cat-ear-right" points="69,30 73,16 62,28" fill="#FFB0C0"/>
    <!-- 脸部白色区域 -->
    <rect x="36" y="48" width="28" height="14" rx="4" fill="#E8E8E8"/>
    <!-- 眼睛 - 大圆萌眼 -->
    <g id="cat-eyes">
      <rect class="cat-eye" x="35" y="40" width="10" height="12" rx="3" fill="#333"/>
      <rect class="cat-eye" x="55" y="40" width="10" height="12" rx="3" fill="#333"/>
      <!-- 瞳孔 -->
      <rect x="38" y="43" width="4" height="7" rx="2" fill="#111"/>
      <rect x="58" y="43" width="4" height="7" rx="2" fill="#111"/>
      <!-- 白色高光 -->
      <rect x="41" y="41" width="3" height="3" rx="1" fill="#fff"/>
      <rect x="61" y="41" width="3" height="3" rx="1" fill="#fff"/>
      <rect x="39" y="46" width="2" height="2" rx="1" fill="#fff" opacity="0.6"/>
      <rect x="59" y="46" width="2" height="2" rx="1" fill="#fff" opacity="0.6"/>
    </g>
    <!-- 鼻子 - 小粉色 -->
    <rect x="48" y="50" width="4" height="3" rx="1.5" fill="#FFB0C0"/>
    <!-- 嘴巴 -->
    <g id="cat-mouth">
      <path d="M 46 54 Q 50 58 54 54" stroke="#999" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    </g>
    <!-- 胡须 -->
    <line x1="18" y1="48" x2="34" y2="50" stroke="#AAA" stroke-width="0.8" opacity="0.5"/>
    <line x1="18" y1="52" x2="34" y2="52" stroke="#AAA" stroke-width="0.8" opacity="0.5"/>
    <line x1="66" y1="50" x2="82" y2="48" stroke="#AAA" stroke-width="0.8" opacity="0.5"/>
    <line x1="66" y1="52" x2="82" y2="52" stroke="#AAA" stroke-width="0.8" opacity="0.5"/>
    <!-- 腮红 - 粉色 -->
    <rect x="32" y="50" width="6" height="4" rx="2" fill="#FFB0C0" opacity="0.4"/>
    <rect x="62" y="50" width="6" height="4" rx="2" fill="#FFB0C0" opacity="0.4"/>
  </svg>
  <div id="companion-tag">已陪你看完 <span id="video-count">0</span> 个视频</div>
</div>

<!-- AI对话面板 -->
<div id="ai-chat-panel">
  <div class="ai-chat-header">
    <div class="ai-chat-title">🐱 小猫助手</div>
    <button class="ai-chat-close" onclick="closeAiChat()">✕</button>
  </div>
  <div class="ai-chat-messages" id="ai-messages"></div>
  <div class="ai-chat-input-bar">
    <input class="ai-chat-input" id="ai-input" type="text" placeholder="和小猫聊聊天..." maxlength="200" onkeydown="if(event.key==='Enter')sendAiMessage()">
    <button class="ai-chat-send" id="ai-send-btn" onclick="sendAiMessage()">↑</button>
  </div>
</div>

<!-- 圆形菜单 -->
<div id="circle-menu">
  <div class="menu-item" data-category="study" onclick="selectCategory('study')">
    <span class="menu-icon">📚</span>
    <span>学习区</span>
  </div>
  <div class="menu-item" data-category="game" onclick="selectCategory('game')">
    <span class="menu-icon">🎮</span>
    <span>游戏区</span>
  </div>
  <div class="menu-item" data-category="food" onclick="selectCategory('food')">
    <span class="menu-icon">🍜</span>
    <span>美食区</span>
  </div>
  <div class="menu-item" data-category="fashion" onclick="selectCategory('fashion')">
    <span class="menu-icon">👗</span>
    <span>穿搭区</span>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
