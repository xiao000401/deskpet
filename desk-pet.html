<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐱 桌宠陪伴门户</title>
<style>
/* ========== 全局重置 ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #000;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* ========== 顶部导航栏（抖音风格） ========== */
#top-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px 16px;
  padding-top: max(10px, env(safe-area-inset-top));
  background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.3) 70%, transparent 100%);
  gap: 18px;
}
.nav-tab {
  font-size: 15px;
  color: rgba(255,255,255,0.6);
  cursor: pointer;
  padding: 4px 0;
  position: relative;
  transition: color 0.25s, transform 0.2s;
  white-space: nowrap;
}
.nav-tab.active {
  color: #fff;
  font-weight: 700;
}
.nav-tab.active::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 50%; transform: translateX(-50%);
  width: 18px; height: 3px;
  background: #fff;
  border-radius: 2px;
}
.nav-tab:hover { color: rgba(255,255,255,0.85); }
.nav-tab:active { transform: scale(0.95); }
.nav-tab-small { font-size: 13px; }

/* ========== 视频流（默认全屏主页） ========== */
#video-feed {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100vh;
  background: #000;
  z-index: 1;
  overflow: hidden;
}
#video-slider {
  width: 100%; height: 100vh;
  transition: transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
.video-slide {
  width: 100%; height: 100vh;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.video-slide video {
  width: 100%; height: 100%;
  object-fit: cover;
}
.video-placeholder {
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #aaa;
  gap: 16px;
}
.video-placeholder .placeholder-icon { font-size: 72px; opacity: 0.35; }
.video-placeholder .placeholder-text { font-size: 16px; opacity: 0.45; }

/* 视频底部信息 */
.video-info {
  position: absolute;
  bottom: 70px; left: 0; right: 70px;
  padding: 0 16px;
  color: #fff;
  z-index: 5;
}
.video-info .video-author {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 8px;
  text-shadow: 0 1px 3px rgba(0,0,0,0.6);
}
.video-info .video-desc {
  font-size: 13px;
  opacity: 0.9;
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}

/* 右侧操作栏 */
.video-actions {
  position: absolute;
  right: 10px;
  bottom: 100px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  z-index: 5;
}
.video-action-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  color: #fff;
  cursor: pointer;
  transition: transform 0.2s;
}
.video-action-btn:hover { transform: scale(1.15); }
.video-action-btn:active { transform: scale(0.9); }
.video-action-btn .action-icon {
  font-size: 30px;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
}
.video-action-btn .action-count {
  font-size: 11px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.6);
}
.video-action-avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 2px solid #fff;
  overflow: hidden;
  position: relative;
  margin-bottom: 6px;
}
.video-action-avatar .avatar-bg {
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}
.video-action-avatar .avatar-follow {
  position: absolute;
  bottom: -6px; left: 50%;
  transform: translateX(-50%);
  width: 18px; height: 18px;
  border-radius: 50%;
  background: #fe2c55;
  color: #fff;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  line-height: 1;
}

/* 底部导航栏 */
#bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 6px 0;
  padding-bottom: max(6px, env(safe-area-inset-bottom));
  background: rgba(0,0,0,0.95);
  border-top: 1px solid rgba(255,255,255,0.08);
}
.bottom-nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  padding: 4px 12px;
  color: rgba(255,255,255,0.5);
  transition: color 0.2s;
}
.bottom-nav-item.active { color: #fff; }
.bottom-nav-item .nav-icon { font-size: 22px; line-height: 1; }
.bottom-nav-item .nav-label { font-size: 10px; }
.bottom-nav-add {
  width: 42px; height: 28px;
  border-radius: 8px;
  background: linear-gradient(135deg, #25f4ee, #fe2c55);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  cursor: pointer;
}
.bottom-nav-add::before {
  content: '';
  position: absolute;
  inset: 2px;
  background: #fff;
  border-radius: 6px;
}
.bottom-nav-add span {
  position: relative;
  z-index: 1;
  font-size: 20px;
  color: #000;
  font-weight: 300;
}

/* 暂停图标 */
.video-pause-icon {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-size: 64px;
  color: rgba(255,255,255,0.75);
  z-index: 6;
  pointer-events: none;
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
  opacity: 0;
}
.video-pause-icon.show {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}

/* 爱心飘动 */
.heart-float {
  position: absolute;
  font-size: 36px;
  pointer-events: none;
  z-index: 8;
  animation: heartFloatUp 1.2s ease-out forwards;
}
@keyframes heartFloatUp {
  0% { opacity: 1; transform: scale(0.3) translateY(0) rotate(0deg); }
  30% { opacity: 1; transform: scale(1.2) translateY(-30px) rotate(-10deg); }
  60% { opacity: 0.8; transform: scale(1) translateY(-80px) rotate(10deg); }
  100% { opacity: 0; transform: scale(0.8) translateY(-140px) rotate(-5deg); }
}

/* ========== 全屏分区页面 ========== */
#category-page {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: #111;
  z-index: 600;
  display: none;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}
#category-page.show { display: block; }
.category-header {
  padding: 20px 20px 8px;
  position: sticky;
  top: 0;
  z-index: 10;
  background: linear-gradient(to bottom, #111 80%, transparent);
}
.category-header-title {
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 4px;
}
.category-header-sub {
  font-size: 12px;
  color: #666;
}
.category-section {
  padding: 8px 16px 0;
}
.category-section-title {
  font-size: 14px;
  font-weight: 600;
  color: #999;
  margin-bottom: 14px;
  padding-left: 4px;
}
.category-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px 0;
  margin-bottom: 24px;
}
.category-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px 4px 10px;
  cursor: pointer;
  border-radius: 12px;
  transition: background 0.2s, transform 0.15s;
  gap: 8px;
}
.category-item:hover { background: rgba(255,255,255,0.06); }
.category-item:active { transform: scale(0.92); background: rgba(255,255,255,0.1); }
.category-icon {
  width: 48px; height: 48px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
}
.category-label {
  font-size: 12px;
  color: #ccc;
  text-align: center;
  line-height: 1.3;
}
.category-close {
  position: fixed;
  top: 20px; right: 20px;
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 20;
}
.category-close:hover { background: rgba(255,255,255,0.2); }

/* 图标背景色 */
.icon-study { background: linear-gradient(135deg, #42a5f5, #1e88e5); }
.icon-game { background: linear-gradient(135deg, #ab47bc, #8e24aa); }
.icon-food { background: linear-gradient(135deg, #ef5350, #e53935); }
.icon-fashion { background: linear-gradient(135deg, #ec407a, #d81b60); }
.icon-music { background: linear-gradient(135deg, #ffa726, #fb8c00); }
.icon-dance { background: linear-gradient(135deg, #26c6da, #00acc1); }
.icon-anime { background: linear-gradient(135deg, #66bb6a, #43a047); }
.icon-tech { background: linear-gradient(135deg, #78909c, #546e7a); }
.icon-fitness { background: linear-gradient(135deg, #ff7043, #f4511e); }
.icon-travel { background: linear-gradient(135deg, #29b6f6, #039be5); }
.icon-knowledge { background: linear-gradient(135deg, #ffca28, #ffb300); }
.icon-vlog { background: linear-gradient(135deg, #8d6e63, #6d4c41); }
.icon-ai { background: linear-gradient(135deg, #7e57c2, #5e35b1); }
.icon-pet { background: linear-gradient(135deg, #a1887f, #8d6e63); }
.icon-film { background: linear-gradient(135deg, #5c6bc0, #3949ab); }
.icon-life { background: linear-gradient(135deg, #4db6ac, #00897b); }

/* ========== 悬浮窗桌宠 ========== */
#pet-fab {
  position: fixed;
  z-index: 500;
  cursor: grab;
  touch-action: none;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
}
#pet-fab:active { cursor: grabbing; }
/* 侧边框吸附隐藏 */
#pet-fab.snapped-left {
  transform: translateX(calc(-100% + 14px));
  cursor: pointer;
}
#pet-fab.snapped-right {
  transform: translateX(calc(100% - 14px));
  cursor: pointer;
}
#pet-fab.snapped-left .cat-body,
#pet-fab.snapped-right .cat-body { animation: none; }
#pet-fab.snapped-left .cat-eye,
#pet-fab.snapped-right .cat-eye { animation: none; }

/* ========== 小猫 SVG 动画 ========== */
.cat-body { animation: catBreathe 3.2s infinite ease-in-out; transform-origin: center bottom; }
@keyframes catBreathe {
  0%, 100% { transform: scaleY(1) translateY(0); }
  50% { transform: scaleY(1.02) translateY(-1px); }
}
.cat-eye { animation: catBlink 10s infinite ease-in-out; transform-origin: center center; }
@keyframes catBlink {
  0%, 8%, 12%, 100% { transform: scaleY(1); }
  10% { transform: scaleY(0.05); }
}
.cat-mouth-talking { animation: mouthTalk 0.3s infinite ease-in-out; }
@keyframes mouthTalk {
  0%, 100% { transform: scaleY(1); }
  50% { transform: scaleY(1.8); }
}
.cat-eye-happy { animation: eyeHappy 0.8s infinite ease-in-out !important; }
@keyframes eyeHappy {
  0%, 100% { transform: scaleY(1) rotate(0deg); }
  50% { transform: scaleY(0.6) rotate(-5deg); }
}
.sleep-zzz {
  position: absolute;
  top: -8px; right: -2px;
  font-size: 12px;
  color: #7c4dff;
  opacity: 0;
  pointer-events: none;
}
.sleep-zzz.active { animation: zzzFloat 2s infinite ease-in-out; }
@keyframes zzzFloat {
  0% { opacity: 0; transform: translate(0, 0) scale(0.5); }
  30% { opacity: 1; }
  100% { opacity: 0; transform: translate(12px, -25px) scale(1.1); }
}
.sleep-zzz:nth-child(2).active { animation-delay: 0.7s; }
.sleep-zzz:nth-child(3).active { animation-delay: 1.4s; }

/* ========== 多动作动画 ========== */
/* 伸懒腰动画 */
@keyframes catStretch {
  0%, 100% { transform: translateY(0) scaleY(1); }
  30% { transform: translateY(-3px) scaleY(1.08); }
  60% { transform: translateY(1px) scaleY(0.95); }
}
.cat-stretching { animation: catStretch 1.5s ease-in-out; }

/* 玩球动画 */
@keyframes catPlay {
  0%, 100% { transform: translateX(0) rotate(0deg); }
  25% { transform: translateX(3px) rotate(5deg); }
  50% { transform: translateX(-2px) rotate(-3deg); }
  75% { transform: translateX(2px) rotate(3deg); }
}
.cat-playing { animation: catPlay 0.8s ease-in-out 3; }

/* 喝水动画 */
@keyframes catDrink {
  0%, 100% { transform: rotate(0deg); }
  30% { transform: rotate(8deg) translateY(2px); }
  60% { transform: rotate(-3deg); }
}
.cat-drinking { animation: catDrink 1.2s ease-in-out 2; }

/* 探头动画 */
@keyframes catPeek {
  0%, 100% { transform: translateY(0); }
  40% { transform: translateY(-6px); }
  70% { transform: translateY(-4px); }
}
.cat-peeking { animation: catPeek 1s ease-in-out 2; }

/* 打哈欠动画 */
@keyframes catYawn {
  0%, 100% { transform: scaleY(1); }
  40% { transform: scaleY(1.3); }
  70% { transform: scaleY(1.1); }
}
.cat-yawning { animation: catYawn 1.5s ease-in-out; }

/* 晚安/睡觉动画 */
@keyframes catSleep {
  0%, 100% { transform: translateY(0) scaleY(1); }
  50% { transform: translateY(1px) scaleY(0.97); }
}
.cat-sleeping-anim { animation: catSleep 2.5s ease-in-out infinite; }

/* ========== 气泡 ========== */
#speech-bubble {
  position: absolute;
  bottom: calc(100% + 10px);
  left: 50%;
  transform: translateX(-50%) scale(0);
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 14px;
  padding: 7px 12px;
  min-width: 100px;
  max-width: 180px;
  text-align: center;
  font-size: 12px;
  color: #333;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
  opacity: 0;
  pointer-events: none;
  white-space: normal;
  line-height: 1.4;
}
#speech-bubble.show { transform: translateX(-50%) scale(1); opacity: 1; }
#speech-bubble::after {
  content: '';
  position: absolute;
  bottom: -6px; left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
  border-top: 6px solid rgba(255,255,255,0.95);
}

/* ========== 陪伴计数标签 ========== */
#companion-tag {
  position: absolute;
  bottom: -22px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-radius: 8px;
  padding: 2px 8px;
  font-size: 10px;
  color: #ff6b9d;
  white-space: nowrap;
  border: 1px solid rgba(255,255,255,0.1);
}

/* ========== 圆形菜单 ========== */
#circle-menu {
  position: fixed;
  z-index: 499;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
}
#circle-menu.show { pointer-events: auto; opacity: 1; }
.menu-item {
  position: absolute;
  width: 62px; height: 62px;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(30,30,30,0.92);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  cursor: pointer;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s, background 0.2s;
  font-size: 10px;
  color: #ccc;
  gap: 2px;
  transform: scale(0);
}
.menu-item .menu-icon { font-size: 20px; line-height: 1; }
#circle-menu.show .menu-item { transform: scale(1); }
.menu-item:hover {
  background: rgba(50,50,50,0.95);
  box-shadow: 0 6px 24px rgba(0,0,0,0.5);
  transform: scale(1.12) !important;
  color: #fff;
}
.menu-item:active { transform: scale(0.95) !important; }

/* ========== AI对话面板 ========== */
#ai-chat-panel {
  position: fixed;
  bottom: 70px;
  left: 50%;
  transform: translateX(-50%) translateY(100%);
  width: calc(100% - 24px);
  max-width: 380px;
  height: 55vh;
  max-height: 420px;
  background: rgba(24,24,24,0.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 20px 20px 0 0;
  border: 1px solid rgba(255,255,255,0.08);
  z-index: 550;
  display: flex;
  flex-direction: column;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
  opacity: 0;
  pointer-events: none;
  overflow: hidden;
}
#ai-chat-panel.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
  pointer-events: auto;
}
.ai-chat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 10px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.ai-chat-title {
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 6px;
}
.ai-chat-close {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  border: none;
  color: #999;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ai-chat-close:hover { background: rgba(255,255,255,0.15); color: #fff; }
.ai-chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.ai-chat-messages::-webkit-scrollbar { width: 3px; }
.ai-chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
.ai-msg {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.5;
  word-break: break-word;
}
.ai-msg.cat {
  align-self: flex-start;
  background: rgba(255,255,255,0.08);
  color: #e0e0e0;
  border-bottom-left-radius: 4px;
}
.ai-msg.user {
  align-self: flex-end;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.ai-msg-typing {
  align-self: flex-start;
  background: rgba(255,255,255,0.08);
  color: #888;
  font-size: 13px;
  padding: 8px 14px;
  border-radius: 16px;
  border-bottom-left-radius: 4px;
}
.ai-chat-input-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
  border-top: 1px solid rgba(255,255,255,0.06);
}
.ai-chat-input {
  flex: 1;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 8px 14px;
  font-size: 14px;
  color: #fff;
  outline: none;
  font-family: inherit;
}
.ai-chat-input::placeholder { color: #666; }
.ai-chat-input:focus { border-color: rgba(255,255,255,0.2); }
.ai-chat-send {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, #667eea, #764ba2);
  border: none;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: transform 0.15s, opacity 0.15s;
}
.ai-chat-send:hover { transform: scale(1.08); }
.ai-chat-send:active { transform: scale(0.92); }
.ai-chat-send:disabled { opacity: 0.4; cursor: default; transform: none; }

@media (max-width: 600px) {
  #ai-chat-panel { width: 100%; border-radius: 16px 16px 0 0; bottom: 60px; }
}

/* ========== 响应式 ========== */
@media (max-width: 600px) {
  .nav-tab { font-size: 14px; gap: 14px; }
  .nav-tab-small { font-size: 12px; }

function initPetPosition() {

  fab.style.left = (w - 64 - 8) + 'px';
  fab.style.top = (h - 64 - 80) + 'px';
}

// ========== 悬浮窗拖拽 ==========
function initPetDrag() {
  const fab = document.getElementById('pet-fab');
  fab.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    isDragging = true;
    didDrag = false;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    petStartX = parseInt(fab.style.left) || 0;
    petStartY = parseInt(fab.style.top) || 0;
    fab.setPointerCapture(e.pointerId);
    recordInteraction();
  });
  fab.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) didDrag = true;
    if (didDrag) {
      let newX = petStartX + dx;
      let newY = petStartY + dy;
      newX = Math.max(0, Math.min(window.innerWidth - 64, newX));
      newY = Math.max(40, Math.min(window.innerHeight - 64 - 60, newY));
      fab.style.left = newX + 'px';
      fab.style.top = newY + 'px';
      if (isMenuOpen) closeCircleMenu();
    }
  });
  fab.addEventListener('pointerup', () => {
    if (isDragging && didDrag) {
      const finalX = parseInt(fab.style.left) || 0;
      checkEdgeSnap(finalX);
    }
    isDragging = false;
  });
}

// ========== 宠物点击（单击开菜单，双击开分区页） ==========

    if (snapSide) { unsnapPet(); return; }

      openCategoryPage();
      lastPetTapTime = 0;

        if (lastPetTapTime !== 0 && Date.now() - lastPetTapTime >= 320) {
          if (isMenuOpen) closeCircleMenu();
          else openCircleMenu();
          lastPetTapTime = 0;
        }
      }, 330);
    }
    recordInteraction();
  });
}

// ========== 侧边框吸附隐藏 ==========
let snapSide = null; // 'left' | 'right' | null
let preSnapX = 0, preSnapY = 0;

function checkEdgeSnap(finalX) {
  const fab = document.getElementById('pet-fab');
  const w = window.innerWidth;
  const snapThreshold = 30; // 距离边缘30px以内触发吸附

  if (finalX < snapThreshold) {
    // 吸附到左边
    snapSide = 'left';
    preSnapX = parseInt(fab.style.left);
    preSnapY = parseInt(fab.style.top);
    fab.style.left = '0px';
    fab.classList.add('snapped-left');
    fab.classList.remove('snapped-right');
    isPetHidden = true;
    closeCircleMenu();
  } else if (finalX > w - 64 - snapThreshold) {
    // 吸附到右边
    snapSide = 'right';
    preSnapX = parseInt(fab.style.left);
    preSnapY = parseInt(fab.style.top);
    fab.style.left = (w - 64) + 'px';
    fab.classList.add('snapped-right');
    fab.classList.remove('snapped-left');
    isPetHidden = true;
    closeCircleMenu();
  }
}

function unsnapPet() {
  if (!snapSide) return;
  const fab = document.getElementById('pet-fab');
  fab.classList.remove('snapped-left', 'snapped-right');
  fab.style.left = preSnapX + 'px';
  fab.style.top = preSnapY + 'px';
  snapSide = null;
  isPetHidden = false;
  recordInteraction();
}

// ========== 圆形菜单 ==========
function openCircleMenu() {
  isMenuOpen = true;
  const menu = document.getElementById('circle-menu');
  const fab = document.getElementById('pet-fab');
  const fabRect = fab.getBoundingClientRect();
  const fabCX = fabRect.left + fabRect.width / 2;
  const fabCY = fabRect.top + fabRect.height / 2;
  const radius = 75;
  const items = menu.querySelectorAll('.menu-item');
  const startAngle = -Math.PI / 2;
  const count = items.length;

  menu.style.left = fabCX + 'px';
  menu.style.top = fabCY + 'px';

  items.forEach((item, i) => {
    const angle = startAngle + (i * Math.PI * 2 / count);
    const x = Math.cos(angle) * radius;
    const y = Math.sin(angle) * radius;
    item.style.left = (x - 31) + 'px';
    item.style.top = (y - 31) + 'px';
    item.style.transitionDelay = (i * 0.04) + 's';
  });
  menu.classList.add('show');
}

function closeCircleMenu() {
  isMenuOpen = false;
  const menu = document.getElementById('circle-menu');
  menu.querySelectorAll('.menu-item').forEach(item => item.style.transitionDelay = '0s');
  menu.classList.remove('show');
}

// ========== 视频滑动 ==========
function initVideoFeedTouch() {
  const feed = document.getElementById('video-feed');
  const slider = document.getElementById('video-slider');

  feed.addEventListener('pointerdown', (e) => {
    if (e.target.closest('#pet-fab') || e.target.closest('#circle-menu') || e.target.closest('#ai-chat-panel') || e.target.closest('.video-action-btn') || e.target.closest('#top-nav') || e.target.closest('#bottom-nav')) return;
    touchStartY = e.clientY;
    touchDeltaY = 0;
    isSwiping = false;
    feed.setPointerCapture(e.pointerId);
  });
  feed.addEventListener('pointermove', (e) => {
    if (touchStartY === 0) return;
    touchDeltaY = e.clientY - touchStartY;
    if (Math.abs(touchDeltaY) > 10) {
      isSwiping = true;
      const offset = currentSlide * window.innerHeight;
      slider.style.transition = 'none';
      slider.style.transform = `translateY(${-offset + touchDeltaY}px)`;
    }
  });
  feed.addEventListener('pointerup', (e) => {
    if (touchStartY === 0) return;
    const wasSwiping = isSwiping;
    const deltaY = touchDeltaY;
    touchStartY = 0; touchDeltaY = 0; isSwiping = false;

    if (!wasSwiping) { handleVideoTap(e); return; }

    const threshold = window.innerHeight * 0.15;
    const data = videoData[currentCategory];
    const maxSlide = data.videos.length - 1;

    if (deltaY < -threshold && currentSlide < maxSlide) {
      currentSlide++;
      videoCount++;
      updateVideoCount();
      recordInteraction();
    } else if (deltaY > threshold && currentSlide > 0) {
      currentSlide--;
      recordInteraction();
    }
    slider.style.transition = 'transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
    slider.style.transform = `translateY(${-currentSlide * window.innerHeight}px)`;
  });

  feed.addEventListener('wheel', (e) => {
    e.preventDefault();
    const data = videoData[currentCategory];
    if (!data) return;
    const maxSlide = data.videos.length - 1;
    if (e.deltaY > 30 && currentSlide < maxSlide) {
      currentSlide++; videoCount++; updateVideoCount(); recordInteraction();
    } else if (e.deltaY < -30 && currentSlide > 0) {
      currentSlide--; recordInteraction();
    }
    slider.style.transition = 'transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
    slider.style.transform = `translateY(${-currentSlide * window.innerHeight}px)`;
  }, { passive: false });
}

// ========== 视频点击/双击 ==========
function handleVideoTap(e) {
  const now = Date.now();
  const slide = e.target.closest('.video-slide');
  if (!slide) return;

  if (now - lastTapTime < 300) {
    createHeartAnimation(e.clientX, e.clientY);
    const likeBtn = slide.querySelector('.like-count');
    const actionBtn = slide.querySelector('.video-action-btn');
    const idx = parseInt(actionBtn.dataset.idx);
    if (!isNaN(idx)) {
      videoData[currentCategory].videos[idx].likes++;
      likeBtn.textContent = formatLikes(videoData[currentCategory].videos[idx].likes);
    }
    lastTapTime = 0;
  } else {
    lastTapTime = now;
    setTimeout(() => {
      if (lastTapTime !== 0 && Date.now() - lastTapTime >= 280) {
        const pauseIcon = slide.querySelector('.video-pause-icon');
        pauseIcon.classList.toggle('show');
        setTimeout(() => pauseIcon.classList.remove('show'), 1200);
        lastTapTime = 0;
      }
    }, 300);
  }
  recordInteraction();
}

function createHeartAnimation(x, y) {
  const hearts = ['❤️', '💖', '💗', '💕', '🩷'];
  for (let i = 0; i < 3; i++) {
    const heart = document.createElement('div');
    heart.className = 'heart-float';
    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    heart.style.left = (x + (Math.random() - 0.5) * 60) + 'px';
    heart.style.top = (y + (Math.random() - 0.5) * 30) + 'px';
    heart.style.animationDelay = (i * 0.12) + 's';
    document.getElementById('video-feed').appendChild(heart);
    setTimeout(() => heart.remove(), 1500);
  }
}

function updateVideoCount() {
  document.getElementById('video-count').textContent = videoCount;
}

function adjustColor(hex, amount) {
  const num = parseInt(hex.replace('#', ''), 16);
  const r = Math.min(255, (num >> 16) + amount);
  const g = Math.min(255, ((num >> 8) & 0x00FF) + amount);
  const b = Math.min(255, (num & 0x0000FF) + amount);
  return `rgb(${r},${g},${b})`;
}

function formatLikes(n) {
  if (n >= 10000) return (n / 10000).toFixed(1) + 'w';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return n.toString();
}

function showBubble(text, duration) {
  const bubble = document.getElementById('speech-bubble');
  bubble.textContent = text;
  bubble.classList.add('show');

  if (bubbleHideTimer) clearTimeout(bubbleHideTimer);
  bubbleHideTimer = setTimeout(() => {
    bubble.classList.remove('show');
    setCatTalking(false);
  }, duration || 3500);
}

function setCatTalking(talking) {
  isTalking = talking;
  const eyes = document.querySelectorAll('.cat-eye');
  const mouth = document.getElementById('cat-mouth');
  if (talking) {
    eyes.forEach(e => e.classList.add('cat-eye-happy'));
    mouth.querySelector('path').classList.add('cat-mouth-talking');
  } else {
    eyes.forEach(e => e.classList.remove('cat-eye-happy'));
    mouth.querySelector('path').classList.remove('cat-mouth-talking');
  }
}

    else if (idle < 15 * 60 * 1000 && isSleeping) setSleeping(false);
  }, 5000);
}

let currentAction = null;
let actionTimer = null;

function startRandomActions() {
  actionTimer = setInterval(() => {
    if (isSleeping || isPetHidden || isTalking) return;
    triggerRandomAction();
  }, 25000); // 每25秒随机触发一个动作
}

function triggerRandomAction() {
  const actions = ['stretch', 'play', 'drink', 'peek', 'yawn'];
  const action = actions[Math.floor(Math.random() * actions.length)];
  playCatAction(action);
}

function playCatAction(action) {
  const svg = document.getElementById('cat-svg');
  if (!svg) return;
  
  // 清除之前的动作
  svg.classList.remove('cat-stretching', 'cat-playing', 'cat-drinking', 'cat-peeking', 'cat-yawning');
  
  // 触发新动作
  const actionMap = {
    stretch: 'cat-stretching',
    play: 'cat-playing',
    drink: 'cat-drinking',
    peek: 'cat-peeking',
    yawn: 'cat-yawning',
  };
  
  svg.classList.add(actionMap[action]);
  currentAction = action;
  
  // 动作结束后移除class
  const durations = { stretch: 1500, play: 2400, drink: 2400, peek: 2000, yawn: 1500 };
  setTimeout(() => {
    svg.classList.remove(actionMap[action]);
    currentAction = null;
  }, durations[action]);
}

function setSleeping(sleeping) {
  isSleeping = sleeping;
  const svg = document.getElementById('cat-svg');
  const zzzElements = document.querySelectorAll('.sleep-zzz');
  const eyes = document.querySelectorAll('.cat-eye');
  if (sleeping) {
    zzzElements.forEach(z => z.classList.add('active'));
    eyes.forEach(e => { e.style.transform = 'scaleY(0.1)'; e.style.animation = 'none'; });
    if (svg) svg.classList.add('cat-sleeping-anim');
  } else {
    zzzElements.forEach(z => z.classList.remove('active'));
    eyes.forEach(e => { e.style.transform = ''; e.style.animation = ''; });
    if (svg) svg.classList.remove('cat-sleeping-anim');
  }
}

  typing.textContent = '小猫正在输入...';
  msgs.appendChild(typing);
  msgs.scrollTop = msgs.scrollHeight;

  const sendBtn = document.getElementById('ai-send-btn');
  sendBtn.disabled = true;

  // 模拟AI回复
  setTimeout(() => {
    typing.remove();
    const response = aiResponses[Math.floor(Math.random() * aiResponses.length)];
    addAiMessage('cat', response);
    sendBtn.disabled = false;
    input.focus();
  }, 800 + Math.random() * 1200);

  recordInteraction();
}

function recordInteraction() { lastInteraction = Date.now(); }

document.addEventListener('mousemove', recordInteraction);
document.addEventListener('touchstart', recordInteraction);
document.addEventListener('keydown', recordInteraction);
document.addEventListener('click', recordInteraction);

window.addEventListener('resize', () => {
  const fab = document.getElementById('pet-fab');
  const x = parseInt(fab.style.left) || 0;
  const y = parseInt(fab.style.top) || 0;
  fab.style.left = Math.min(x, window.innerWidth - 64) + 'px';
  fab.style.top = Math.min(y, window.innerHeight - 64 - 60) + 'px';
});

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
